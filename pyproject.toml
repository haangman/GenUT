[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "genut"
version = "0.1.0"
description = "Generate gtest and KUnit unit tests with static analysis and LLM agents"
readme = "docs/design.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "typer>=0.12",
  "httpx>=0.27",
  "pyyaml>=6",
  "jinja2>=3.1",
  "libclang>=16",
]

[project.optional-dependencies]
claude = ["anthropic>=1.0"]
dev = ["pytest>=8", "pytest-cov>=5", "anthropic>=1.0"]

[project.scripts]
genut = "genut.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/genut"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs cmake, a C/C++ compiler and gtest; skipped when missing",
  "libclang: needs the libclang shared library; skipped when missing",
]
