# libclang이 모르는 gcc 전용 플래그 (설계 6.2). glob 패턴. 코드 수정 없이 추가할 수 있다.
# 정제 뒤에도 "unknown argument"가 나오면 그 플래그를 자동으로 빼고 다시 파싱하며,
# 그렇게 배운 플래그는 $GENUT_HOME/knowledge/flag_sanitizer.learned.yaml 에 쌓인다.
remove:
  - "-mno-fp-ret-in-387"
  - "-mpreferred-stack-boundary=*"
  - "-mskip-rax-setup"
  - "-mindirect-branch=*"
  - "-mindirect-branch-register"
  - "-mindirect-branch-cs-prefix"
  - "-mfunction-return=*"
  - "-mrecord-mcount"
  - "-mharden-sls=*"
  - "-mstack-protector-guard-reg=*"
  - "-mstack-protector-guard-symbol=*"
  - "-mstack-protector-guard-offset=*"
  - "-mabi=lp64"
  - "-fconserve-stack"
  - "-fno-allow-store-data-races"
  - "-fno-var-tracking-assignments"
  - "-fno-ipa-sra"
  - "-fno-ipa-cp-clone"
  - "-fno-inline-functions-called-once"
  - "-fno-partial-inlining"
  - "-fmerge-constants"
  - "-falign-jumps=*"
  - "-falign-loops=*"
  - "-fmin-function-alignment=*"
  - "-fno-tree-loop-im"
  - "-fsanitize-coverage=trace-pc"
  - "-fplugin=*"
  - "-fplugin-arg-*"
  - "-fasan-shadow-offset=*"
  - "-fdiagnostics-show-context*"
  - "-fno-stack-clash-protection"
  - "-Wno-maybe-uninitialized"
  - "-Wimplicit-fallthrough=*"
  - "-Wno-alloc-size-larger-than"
  - "-Wno-dangling-pointer"
  - "-Wno-stringop-*"
  - "-Wno-packed-not-aligned"
  - "-Wno-restrict"
  - "-Wno-array-bounds"
  - "-Wno-format-overflow"
  - "-Wno-format-truncation"
# 다음 인자 하나를 값으로 가지는 플래그 (값까지 함께 뺀다)
remove_with_value:
  - "--param"
# 항상 덧붙이는 플래그
append:
  - "-Wno-unknown-warning-option"
  - "-Wno-unused-command-line-argument"
